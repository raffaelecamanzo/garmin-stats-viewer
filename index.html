<script>
const ITER = 600000;
const msg = document.getElementById("msg");
const supported = window.isSecureContext && window.crypto?.subtle && "DecompressionStream" in window;
if (!supported) msg.textContent = "This browser can't open the page (needs iOS/Safari 16.4+, Chrome or Firefox 113+).";
// The passphrase is lowercase words joined by '-': forgive pasted spaces, a capitalised first letter, typed spaces or dashes.
const normalise = s => s.trim().toLowerCase().replace(/[\s\u2010-\u2015]+/g, "-");
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (!supported) return;
  msg.textContent = "Decrypting…";
  let zipped;
  try {
    const raw = Uint8Array.from(atob(document.getElementById("payload").textContent.trim()), c => c.charCodeAt(0));
    if (new TextDecoder().decode(raw.slice(0, 8)) !== "Salted__") throw new Error("payload is not OpenSSL salted data");
    const salt = raw.slice(8, 16), ct = raw.slice(16);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normalise(document.getElementById("p").value)),
      "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      {name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256"}, base, 384));
    const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    try {
      zipped = await crypto.subtle.decrypt({name: "AES-CBC", iv: bits.slice(32, 48)}, key, ct);
    } catch {
      msg.textContent = "Wrong passphrase."; return;
    }
  } catch (err) {
    msg.textContent = "Couldn't decrypt: " + err.message; return;
  }
  let html;
  try {
    html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  } catch {
    msg.textContent = "Wrong passphrase."; return;  // a wrong key passes the padding check about 1 time in 256
  }
  document.open(); document.write(html); document.close();
});
</script></body></html>
